[package]
name = "woant-office-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Woant Office engine: session, selection, undo, the command registry (every action is a command), Word's command catalog, file I/O dispatch"

[lints]
workspace = true

[dependencies]
woant-office-geom = { workspace = true }
woant-office-doc = { workspace = true }
woant-office-fonts = { workspace = true }
woant-office-layout = { workspace = true }
woant-office-render = { workspace = true }
woant-office-proof = { workspace = true }
woant-office-docx = { workspace = true }
woant-office-docbin = { workspace = true }
woant-office-pdf = { workspace = true }
woant-office-formats = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
regex-automata = { workspace = true }
image = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock for `now_iso` (`SystemTime::now()` panics on wasm32).
js-sys = "0.3"

[dev-dependencies]
zip = { workspace = true }
