[package]
name = "woant-office-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Woant Office rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints]
workspace = true

[dependencies]
woant-office-geom = { workspace = true }
woant-office-doc = { workspace = true }
woant-office-fonts = { workspace = true }
woant-office-layout = { workspace = true }
woant-office-metafile = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
