[package]
name = "woant-office-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Woant Office egui front end (Word-style ribbon UI); swappable: nothing below depends on it"

[lints]
workspace = true

[dependencies]
woant-office-geom = { workspace = true }
woant-office-doc = { workspace = true }
woant-office-fonts = { workspace = true }
woant-office-layout = { workspace = true }
woant-office-render = { workspace = true }
woant-office-engine = { workspace = true }
woant-office-zotero = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# Pictures pasted from the system clipboard arrive as pixels and are inserted as PNG (#45).
image = { workspace = true }
# The system's preferred interface languages (#8). Native: OS APIs; wasm: none (English).
sys-locale = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock (`SystemTime::now()`/`Instant::now()` panic on wasm32).
js-sys = "0.3"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
zip = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
